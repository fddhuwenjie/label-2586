[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 800x600x24
autorestart=true
priority=100

[program:fluxbox]
command=/usr/bin/fluxbox -no-toolbar
environment=DISPLAY=":99"
autorestart=true
priority=200

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -rfbport 5900
autorestart=true
priority=300

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 6080 localhost:5900
autorestart=true
priority=400

[program:game]
command=/usr/local/bin/python /app/main.py
environment=DISPLAY=":99"
autorestart=true
priority=500
startsecs=3
